# Netlify использует OpenNext-адаптер и определяет Next.js сам — здесь только то,
# что стоит зафиксировать явно ради воспроизводимости сборки.
# Адаптер намеренно НЕ закреплён версией: Netlify обновляет его под каждый релиз Next.js.

[build]
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "22"
  # Сборка тянет шрифты с fonts.googleapis.com — без сети next/font упадёт
  NEXT_TELEMETRY_DISABLED = "1"

# Заголовки безопасности. Приложение полностью самодостаточно: внешних скриптов нет,
# единственный внешний источник — шрифты Google, они инлайнятся на этапе сборки.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
