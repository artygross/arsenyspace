# Деплой сайта рассады. В панели Netlify для этого сайта укажите
# Base directory = Seedlings/site — тогда этот файл станет корневым конфигом сборки.
# Адаптер OpenNext намеренно НЕ закрепляется версией: Netlify обновляет его под релизы Next.js.

[build]
  command = "npx next build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
