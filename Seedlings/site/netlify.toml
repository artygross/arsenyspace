# Конфигурация сборки сайта рассады.
#
# Netlify ищет netlify.toml в package directory → base directory → корне репозитория,
# поэтому этот файл действует, когда в настройках проекта указан
# Package directory = Seedlings/site (base directory оставляем корнем — оттуда
# ставятся зависимости всего pnpm-воркспейса).
#
# Команда собирает пакет по имени, а не по пути, поэтому работает и из корня,
# и из директории пакета. Адаптер OpenNext Netlify подключает сам и версией
# намеренно не закрепляется: Netlify обновляет его под релизы Next.js.

[build]
  command = "pnpm --filter seedlings-site build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Сборка тянет шрифты с fonts.googleapis.com — без сети next/font упадёт
  NEXT_TELEMETRY_DISABLED = "1"

# Приложение самодостаточно: внешних скриптов нет, шрифты инлайнятся при сборке.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
